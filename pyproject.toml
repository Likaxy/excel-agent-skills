[project]
name = "excel-agent-skills"
version = "0.1.7"
description = "Excel agent skills for manipulating Excel files"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.10.1",
    "fastmcp>=2.0.0,<3.0.0",
    "openpyxl>=3.1.5",
    "typer>=0.16.0"
]
[[project.authors]]
name = "freyzo"
email = "freyzo@users.noreply.github.com"

[project.scripts]
excel-agent-skills = "xl_agent.__main__:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xl_agent"]

[tool.hatch.build]
packages = ["src/xl_agent"]
